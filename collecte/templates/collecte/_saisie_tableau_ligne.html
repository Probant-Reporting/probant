{% load collecte %}<tr role="row">{% for c in ligne %}<td class="{{ c.col.type }}" role="cell" data-label="{{ c.col.libelle }}"><input type="text" value="{{ c.v }}" aria-label="{{ c.col.libelle }}" data-colonne="{{ c.col.code }}" autocomplete="off"{% if c.col.type == "nombre" %} inputmode="decimal"{% endif %}{% if c.col.options %} list="dl-{{ kpi.code|slugify }}-{{ c.col.code|slugify }}"{% endif %}{% if not droits.modifier or saisi.non_applicable %} disabled{% endif %}></td>{% endfor %}{% if droits.modifier %}<td class="action-ligne" role="cell"><button type="button" class="icone" data-supprimer-ligne aria-label="{% libelle "saisie.tableau.supprimer" %}" title="{% libelle "saisie.tableau.supprimer" %}"{% if saisi.non_applicable %} disabled{% endif %}>{% icone "x" %}</button></td>{% endif %}</tr>
