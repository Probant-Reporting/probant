<p class="{{ classe|default:'' }}">{% if champ.field.widget.input_type == "checkbox" %}<label>{{ champ }} {{ champ.label }}</label>{% else %}<label class="titre" for="{{ champ.id_for_label }}">{{ champ.label }}{% if champ.field.required %} *{% endif %}</label>{{ champ }}{% endif %}
  {% if champ.help_text %}<span class="discret en-bloc">{{ champ.help_text }}</span>{% endif %}{{ champ.errors }}</p>
