{# Choix d'une campagne dans un formulaire (sans envoi automatique) : par référentiel s'il y en a plusieurs. #}
{% load collecte %}<select name="campagne">
  {% for ref, liste in groupes_campagnes %}{% if groupes_campagnes|length > 1 %}<optgroup label="{{ ref }}">{% endif %}
    {% for c in liste %}<option value="{{ c.pk }}" {% if c.pk == campagne.pk %}selected{% endif %}>{{ c.nom_affiche }}{% if avec_statut %} · {{ c|choix_phrase:"statut" }}{% endif %}</option>{% endfor %}
  {% if groupes_campagnes|length > 1 %}</optgroup>{% endif %}{% endfor %}
</select>
