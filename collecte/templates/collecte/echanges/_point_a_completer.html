{% load collecte %}{# Une valeur importée à compléter avant de la valider : nom du KPI, organisation, raison, lien vers sa case (ancien résultat en texte : tel quel) #}<div class="pa-point pa-alerte"><span class="pa-pastille"></span><span class="pa-texte">{% if m.kpi %}<a class="pa-lien" href="{{ m.url }}" data-panneau>{{ m.nom }}</a> <span class="discret">{{ m.kpi }} · {{ m.organisation }}</span><span class="pa-detail">{{ m.detail }}</span>{% else %}<span class="pa-detail">{{ m }}</span>{% endif %}</span></div>
