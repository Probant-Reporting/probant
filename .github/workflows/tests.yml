# Automatic checks on every push to main, on every pull request, and on demand (Actions > Tests > Run workflow, on any
# branch). Not on every push to a work branch: a complete run is long, so on a work branch the suite is run locally
# before each merge, then here on demand or by the pull request.
#   sqlite      the whole suite on SQLite, in parallel (the default database of the tool)
#   postgresql  the whole suite on PostgreSQL 16 (the database of the Clever Cloud and Docker "postgres" installations)
#   browser     every browser test (the files test_navigateur_*.py of every application) in Chromium, in
#               parallel; REQUIRE_BROWSER_TESTS=1 turns a missing browser into a failure instead of a silent skip;
#               axe-core (pinned version, AXE_JS) runs the automatic accessibility checks
#   docker      the Docker path of docs/installation.md on a blank runner, with SQLite and with PostgreSQL:
#               ./install.sh, health page, version, demo, sign-in, backup, restore, ./update.sh; with SQLite, also
#               the one-line installation (get.sh) from a local copy of the repository and a local image registry
#   update-published  an installation of ANY published version goes straight to this version, with no step in between:
#               for each version listed in CHANGELOG.md, a demo database built with the code of that version (the git
#               tag vX.Y.Z), updated with this commit, then compared (rows, values, statuses, evidence files, closed
#               years, backup and restore, an archive of the old version restored by this one) and started (/sante/
#               green, sign-in); SQLite and PostgreSQL (qa/update_from_published.py)
#   lint        ruff: mechanical defects (unused import or variable, undefined name, function defined twice...); no
#               style rule, nothing is reformatted (rules in pyproject.toml)
#   audit       known vulnerabilities in the pinned production packages (informational: never blocks)
# Versions of the packages are pinned in requirements.txt and requirements-dev.txt (how to update them: see the header
# of requirements.txt).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# a new push to the same branch cancels the run that is still going
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  DJANGO_SECRET_KEY: ci-only-key-not-a-secret

jobs:
  sqlite:
    name: Tests (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # optional list of words and colours that the maintainers do not want in the repository
    # (parametres/aides_tests/interdits.py), given only to the two jobs that run the whole suite; GitHub never gives a
    # secret to a pull request from a fork: there, the test is skipped
    env:
      PROBANT_FORBIDDEN: ${{ secrets.PROBANT_FORBIDDEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python manage.py check
      - name: No migration forgotten
        run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput --parallel 4

  postgresql:
    name: Tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    # the whole suite takes close to an hour here; 60 minutes stopped it before the end
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: essai
          POSTGRES_PASSWORD: essai
          POSTGRES_DB: essai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U essai -d essai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # optional list of words and colours that the maintainers do not want in the repository
    # (parametres/aides_tests/interdits.py), given only to the two jobs that run the whole suite; GitHub never gives a
    # secret to a pull request from a fork: there, the test is skipped
    env:
      DATABASE_URL: postgres://essai:essai@127.0.0.1:5432/essai
      PROBANT_FORBIDDEN: ${{ secrets.PROBANT_FORBIDDEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      # in parallel like the SQLite job
      - run: python manage.py test --noinput --parallel 4

  browser:
    name: Tests (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Blocking, like the other test jobs. A browser test that fails only sometimes is a defect to fix (wait for the
    # exact state the page reaches), not a reason to skip it.
    env:
      REQUIRE_BROWSER_TESTS: "1"
      AXE_JS: ${{ github.workspace }}/.axe/package/axe.min.js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: axe-core for the accessibility checks (pinned version)
        run: |
          mkdir -p .axe
          cd .axe
          npm pack axe-core@4.14.0
          tar -xzf axe-core-4.14.0.tgz
          test -s package/axe.min.js
      # every browser test: a browser test is a file named test_navigateur_*.py, in any application (collecte,
      # serveur_mcp...); the pattern finds a new one without a list to keep up to date. Two processes, each with its
      # own Chromium and its own test database.
      - name: Browser tests (all files test_navigateur_*.py)
        run: python manage.py test --noinput --parallel 2 --pattern "test_navigateur_*.py"

  docker:
    # The path of docs/installation.md, played without a person on a blank runner: install, demo, sign-in, backup,
    # restore, update to the same version. Each step says what it checks: the name of the failed step is the failed
    # check, and the last step shows the logs of the containers. The code is copied without .git (like a downloaded
    # archive), so that ./update.sh rebuilds the same version instead of running "git pull".
    name: Docker (install, update, backup, restore) – ${{ matrix.database }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgresql]
    defaults:
      run:
        shell: bash
        working-directory: install-test
    env:
      URL: http://127.0.0.1:8000
      DEMO_PASSWORD: demo-probant-2026
    steps:
      - uses: actions/checkout@v7
      - name: Blank folder with the code of this commit
        working-directory: .
        run: |
          mkdir install-test
          git archive HEAD | tar -x -C install-test
          docker version --format 'Docker {{.Server.Version}}'
          docker compose version
      - name: "PostgreSQL: .env written before the installation (docs/installation.md, section 8)"
        if: matrix.database == 'postgresql'
        run: |
          cp .env.example .env
          chmod 600 .env
          # user and database of the "db" service, read from docker-compose.yml (one place to change them)
          read -r PG_USER PG_DB < <(docker compose --profile postgres config --format json | python3 -c '
          import json, sys
          e = json.load(sys.stdin)["services"]["db"]["environment"]
          print(e["POSTGRES_USER"], e["POSTGRES_DB"])')
          PG_PASSWORD="$(LC_ALL=C tr -dc 'A-Za-z0-9' </dev/urandom | head -c 24 || true)"
          sed -i -e "s|^COMPOSE_PROFILES=.*|COMPOSE_PROFILES=postgres|" \
                 -e "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$PG_PASSWORD|" \
                 -e "s|^DATABASE_URL=.*|DATABASE_URL=postgres://$PG_USER:$PG_PASSWORD@db:5432/$PG_DB|" .env
          grep -q '^COMPOSE_PROFILES=postgres$' .env && grep -q "^DATABASE_URL=postgres://$PG_USER:" .env
      - name: Install (./install.sh, builds the image and waits for the tool)
        run: ./install.sh
      - name: Health page is green
        run: |
          HEALTH="$(curl -fsS "$URL/sante/")"
          echo "$HEALTH"
          grep -q '"etat": "ok"' <<<"$HEALTH"
          # empty database: the home page leads to the "Setup" wizard
          LOCATION="$(curl -s -o /dev/null -w '%{redirect_url}' "$URL/")"
          echo "home page leads to: $LOCATION"
          [[ "$LOCATION" == */mise-en-place/ ]]
      - name: Database in use is the one of this variant
        run: |
          ENGINE="$(docker compose exec -T web python manage.py shell --no-imports -c 'from django.db import connection; print(connection.vendor)')"
          echo "database: $ENGINE"
          test "$ENGINE" = "${{ matrix.database }}"
      - name: Version of the tool is the version of this commit
        run: |
          EXPECTED="$(cat VERSION)"
          test "$(docker compose exec -T web cat /app/VERSION)" = "$EXPECTED"
          # local call inside the container: /sante/ gives the detail, version included
          SHOWN="$(docker compose exec -T web python -c "import json, urllib.request; print(json.load(urllib.request.urlopen('http://127.0.0.1:8000/sante/', timeout=5))['version'])")"
          echo "version shown: $SHOWN"
          test "$SHOWN" = "$EXPECTED"
      - name: Load the demo (command of the README; -T because there is no terminal here)
        run: docker compose exec -T web python manage.py load_demo
      - name: Sign in and open a page
        run: bash docker/check_sign_in.sh "$URL" admin "$DEMO_PASSWORD" "$(cat VERSION)"
      - name: Back up
        run: |
          docker compose exec -T web python manage.py backup --reason ci-test
          docker compose exec -T web sh -c 'ls /data/backups/backup-*-ci-test.zip'
      - name: Restore the backup (a change made after it disappears)
        run: |
          docker compose exec -T web python manage.py shell --no-imports -c "
          from referentiel.models import Utilisateur
          Utilisateur.objects.create(username='after-backup@example.test', email='after-backup@example.test', role='lecteur')"
          ARCHIVE="$(docker compose exec -T web sh -c 'cd /data/backups && ls -t backup-*-ci-test.zip | head -1')"
          docker compose exec -T web python manage.py restore "$ARCHIVE" --yes
          docker compose restart web
      - name: Health page is green after the restore
        run: |
          for _ in $(seq 90); do curl -fs "$URL/sante/" >/dev/null && break; sleep 2; done
          curl -fsS "$URL/sante/" | grep -q '"etat": "ok"'
          docker compose exec -T web python manage.py shell --no-imports -c "
          from referentiel.models import Utilisateur
          assert not Utilisateur.objects.filter(username='after-backup@example.test').exists(), 'the restore kept a later change'
          assert Utilisateur.objects.filter(username='admin').exists(), 'the restore lost the demo accounts'"
          bash docker/check_sign_in.sh "$URL" admin "$DEMO_PASSWORD"
      - name: Update to the same version (./update.sh)
        run: |
          ./update.sh
          docker compose exec -T web sh -c 'ls /data/backups/*before-update.zip'
      - name: Health page is green and sign-in works after the update
        run: |
          curl -fsS "$URL/sante/" | grep -q '"etat": "ok"'
          bash docker/check_sign_in.sh "$URL" admin "$DEMO_PASSWORD" "$(cat VERSION)"
      # cosign: test signatures of the lists of sums (get.sh, update.sh) and of the automatic updates
      - name: Install cosign (test signatures)
        uses: sigstore/cosign-installer@v4.1.4
      # get.sh as an IT team runs it ("curl … | sh"), with the image built above, from a local copy of the public
      # repository and a local registry (other ports, other Compose project: the installation above is not touched);
      # the files of each version checked against its list of sums, signed with a test key (a file changed: refused);
      # then ./update.sh to a newer version and the way back of docs/installation.md. Once: it does not depend on the database.
      - name: "One-line installation (get.sh), update to a newer version, going back"
        if: matrix.database == 'sqlite'
        run: IMAGE_UNDER_TEST=probant:local bash docker/test_get.sh
      # A server without Internet access: offline packages of two versions made from the image built above
      # (docker/make_offline_package.sh), installation, update and going back; the name of the image points to a
      # registry where nothing answers, curl and wget fail, and no image download may appear in the Docker events.
      - name: "Installation without Internet access (offline package), update, going back"
        if: matrix.database == 'sqlite'
        run: IMAGE_UNDER_TEST=probant:local bash docker/test_offline.sh
      # Company network: a test authority signs a server certificate; ./install.sh --domain --cert --key --ca-cert with
      # Caddy (curl --cacert, health page through HTTPS, no ACME), outgoing HTTPS call of the tool, renewal; the same
      # without Internet access (offline package with the image of Caddy). Ports 80 and 443 of the runner.
      - name: "Certificate of the company (HTTPS) and internal authority, online and offline"
        if: matrix.database == 'sqlite'
        run: IMAGE_UNDER_TEST=probant:local bash docker/test_custom_certificate.sh
      # Automatic updates (auto-update.sh, docs/installation.md "Automatic updates"): a local registry, versions of the image
      # built above (signed, unsigned, signed with another key, that does not start, that migrates then fails), a test
      # key of cosign instead of the identity of the workflow (that check runs in image.yml, at each published version),
      # with SQLite and with PostgreSQL: going back with and without restore, lock, window, notify only, update.
      - name: "Automatic updates: signature, window, going back with and without restore, lock"
        run: IMAGE_UNDER_TEST=probant:local TEST_DATABASE=${{ matrix.database }} bash docker/test_auto_update.sh
      - name: Logs of the containers (after a failure)
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --no-color --tail 300 || true

  update-published:
    # "You can update from any published version directly": nothing here names a version. The versions are read from
    # CHANGELOG.md and their code from the tags vX.Y.Z (fetch-depth: 0 brings the tags), so each new published version is
    # taken by the next run. The script builds each old database with the code of that version, in its own folder and
    # with its own packages when requirements.txt differs, and gives it to qa/migration_rehearsal.py.
    name: Update from every published version – ${{ matrix.database }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgresql]
    services:
      # started for both variants (a few seconds); only the postgresql variant uses it
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: essai
          POSTGRES_PASSWORD: essai
          POSTGRES_DB: essai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U essai -d essai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Versions and code that will be tried
        run: git tag --list 'v*' --sort=version:refname
      - name: Update from every published version to this commit, then compare and start
        run: >-
          python qa/update_from_published.py
          --database ${{ matrix.database }}
          --postgres postgres://essai:essai@127.0.0.1:5432/postgres
          --pg-prefix update_check
          --port 8603

  lint:
    name: Code check (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # same version as requirements-dev.txt
      - run: pip install ruff==0.17.5
      - run: ruff check .

  audit:
    name: Known vulnerabilities (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true  # informational: a new advisory must not block unrelated work
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r requirements.txt --no-deps --disable-pip
