# Publishes the Docker image (ghcr.io/<owner>/<repository>): on a version tag (v1.0.0…) or on demand
# (Actions tab › "Docker image" › Run workflow). Before publishing: tests (same pinned packages and same parallel
# suite as .github/workflows/tests.yml, which also runs the PostgreSQL and browser tests on every push), then
# installation on a blank machine (docker/test_installation.sh).
name: Docker image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# one run at a time for a tag; a second run waits instead of cancelling a push of the image
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write  # push the image to ghcr.io
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Tests
        run: |
          pip install -r requirements-dev.txt
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test --noinput --parallel 4
      - name: Installation on a blank machine
        run: bash docker/test_installation.sh
      - name: Log in to the registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          VERSION=$(cat VERSION)
          docker build --build-arg VERSION_COMMIT=${{ github.sha }} -t $IMAGE:$VERSION -t $IMAGE:latest .
          docker push $IMAGE:$VERSION
          docker push $IMAGE:latest
