name: Bug report
description: Something in Probant does not work as the guides describe.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include real data: no values, no email addresses, no names of people or of organisations.
        For a security problem, do not use this form: use GitHub's private vulnerability reporting (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Version
      description: The version shows at the bottom of each page of the tool.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation
      options:
        - Docker with SQLite
        - Docker with PostgreSQL
        - Managed hosting (Clever Cloud)
        - Other
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Role of the account
      options:
        - Administrator
        - Validator
        - Contributor
        - Reader
        - Auditor
        - Not signed in
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The page, then each action, in order.
      placeholder: |
        1. Open Data entry.
        2. Select ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Language of the interface
      placeholder: English
